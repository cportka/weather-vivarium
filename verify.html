<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>weather-vivarium — reference set</title>
<meta name="description" content="Flip through the weather-vivarium reference cities one at a time: every biome, hamlet to megacity, day and night." />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0e1016" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.open-meteo.com; base-uri 'self'; form-action 'none'; object-src 'none'" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  :root { --bg:#0e1016; --panel:#171a22; --ink:#e6e9ef; --muted:#9aa2b1; --accent:#4a9eff; --line:#252a35; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1100px 600px at 50% -10%, #1a2030, var(--bg)); color:var(--ink);
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; min-height:100vh; }
  header { text-align:center; padding:18px 16px 4px; }
  h1 { margin:0; font-size:18px; }
  header p { margin:6px 0 0; color:var(--muted); font-size:12.5px; }
  header p.ver { font-size:11.5px; opacity:.75; }
  main { max-width:980px; margin:0 auto; padding:14px 16px 40px; }
  .stage { display:flex; align-items:center; justify-content:center; gap:18px; }
  .nav { background:#20263340; border:1px solid var(--line); color:var(--ink); border-radius:10px;
    padding:20px 14px; font:inherit; font-size:20px; cursor:pointer; line-height:1; user-select:none; }
  .nav:hover { border-color:var(--accent); }
  .nav:disabled { opacity:.3; cursor:default; }
  .scene { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #mount { width:300px; height:300px; display:flex; align-items:center; justify-content:center; }
  .title { font-size:16px; font-weight:600; text-align:center; }
  .sub { color:var(--muted); font-size:12px; text-align:center; }
  .bar { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  select, button.ctl { background:#0f121a; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button.ctl.on { background:var(--accent); border-color:var(--accent); color:#08111f; font-weight:600; }
  .count { color:var(--muted); font-size:12px; }
  .card { margin:16px auto 0; max-width:640px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; font-size:12px; line-height:1.5;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:0 20px; }
  .card .r { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-top:1px solid rgba(255,255,255,.05); }
  .card .k { color:var(--muted); white-space:nowrap; }
  .card .v { text-align:right; font-weight:600; }
  .strip { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:18px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#2a3040; border:none; padding:0; cursor:pointer; }
  .dot.on { background:var(--accent); }
  a { color:var(--accent); text-decoration:none; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 30px; }
</style>
</head>
<body>
<header>
  <h1>weather-vivarium — reference set</h1>
  <p>the standing cities we judge every change against · <b>← →</b> to flip · <b>space</b> for day/night</p>
  <p class="ver">weather-vivarium <b id="ver">…</b></p>
</header>
<main>
  <div class="stage">
    <button class="nav" id="prev" title="Previous (←)">◀</button>
    <div class="scene">
      <div id="mount"></div>
      <div class="title" id="title">…</div>
      <div class="sub" id="sub"></div>
    </div>
    <button class="nav" id="next" title="Next (→)">▶</button>
  </div>

  <div class="bar">
    <select id="jump"></select>
    <button class="ctl" id="tod">☀️ day</button>
    <button class="ctl" id="live">live weather</button>
    <span class="count" id="count"></span>
  </div>

  <div class="card" id="card"></div>
  <div class="strip" id="strip"></div>
</main>
<footer>
  <a href="index.html">← demo</a> · <a href="gallery.html">the wall →</a> ·
  <a href="https://github.com/cportka/weather-vivarium/blob/main/verify/reference-cities.mjs">the list</a>
</footer>

<script type="module">
  import { createVivarium, VERSION } from "./src/index.js";
  import { REFERENCE_CITIES } from "./verify/reference-cities.mjs";

  const mount = document.getElementById("mount");
  const titleEl = document.getElementById("title"), subEl = document.getElementById("sub");
  const cardEl = document.getElementById("card"), countEl = document.getElementById("count");
  const jump = document.getElementById("jump"), strip = document.getElementById("strip");
  const todBtn = document.getElementById("tod"), liveBtn = document.getElementById("live");

  let i = 0, inst = null, night = false, live = false, paintTimer = null;

  REFERENCE_CITIES.forEach((c, n) => {
    const o = document.createElement("option"); o.value = n; o.textContent = c.name; jump.appendChild(o);
    const d = document.createElement("button"); d.className = "dot"; d.title = c.name;
    d.onclick = () => show(n); strip.appendChild(d);
  });

  function paintCard() {
    if (!inst || !inst.attributes) return;
    const rows = inst.attributes();
    cardEl.textContent = "";
    for (const { label, value } of rows) {
      const r = document.createElement("div"); r.className = "r";
      const k = document.createElement("span"); k.className = "k"; k.textContent = label;
      const v = document.createElement("span"); v.className = "v"; v.textContent = value;
      r.append(k, v); cardEl.appendChild(r);
    }
    const res = inst.resolution;
    if (res) subEl.textContent = res.landscape.name + " · " + res.biome.id +
      (res.landmark ? " · " + res.landmark.name : "");
  }

  function show(n) {
    i = (n + REFERENCE_CITIES.length) % REFERENCE_CITIES.length;
    const c = REFERENCE_CITIES[i];
    if (inst) inst.destroy();
    if (paintTimer) clearInterval(paintTimer);
    inst = createVivarium(mount, {
      city: c.name, lat: c.lat, lon: c.lon, country: c.country, population: c.population,
      size: 300, interactive: true, minimalData: !live, refreshMs: 0,
      // A fixed hour makes the set comparable frame to frame; "live weather" hands
      // it back to whatever is actually happening there right now.
      now: live ? undefined : (night ? 60 : 840)
    });
    titleEl.textContent = c.name + (c.country ? ", " + c.country : "");
    countEl.textContent = (i + 1) + " / " + REFERENCE_CITIES.length;
    jump.value = String(i);
    [...strip.children].forEach((d, n2) => d.classList.toggle("on", n2 === i));
    paintCard();
    paintTimer = setInterval(paintCard, 1200);
    setTimeout(() => { if (paintTimer) { clearInterval(paintTimer); paintTimer = null; } }, 15000);
  }

  document.getElementById("prev").onclick = () => show(i - 1);
  document.getElementById("next").onclick = () => show(i + 1);
  jump.onchange = () => show(+jump.value);
  todBtn.onclick = () => { night = !night; todBtn.textContent = night ? "🌙 night" : "☀️ day"; todBtn.classList.toggle("on", night); show(i); };
  liveBtn.onclick = () => { live = !live; liveBtn.classList.toggle("on", live); show(i); };
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); show(i - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); show(i + 1); }
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); todBtn.click(); }
  });

  document.getElementById("ver").textContent = "v" + VERSION;
  show(0);
</script>
</body>
</html>
