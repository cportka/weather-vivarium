<!doctype html>
<html><head><meta charset="utf-8"><title>weather-vivarium verify harness</title>
<style>body{margin:0;background:#141018;font-family:monospace;color:#ddd}canvas{image-rendering:pixelated}</style>
</head><body>
<canvas id="out" width="10" height="10"></canvas>
<script type="module">
import { CATALOG } from "../src/catalog/index.js";
import { LANDMARKS } from "../src/catalog/landmarks.js";
import { createPainter } from "../src/engine/painter.js";
import { resolveScene } from "../src/world/resolve.js";
import { pools } from "../src/catalog/index.js";
import { createScene } from "../src/scene/compositor.js";
import { defaultState } from "../src/data/weather.js";
import { seedFrom } from "../src/engine/random.js";
import { moonIllumination, dayFactor } from "../src/engine/astronomy.js";
import { drawMoon } from "../src/engine/celestial.js";

// Moon phase strip: waxing new→full→waning across a night sky, to check phases
// read naturally (no double-circle).
window.moonSheet = function () {
  const phases = [
    ["new", { fraction: 0.04, waxing: true }],
    ["cresc+", { fraction: 0.25, waxing: true }],
    ["quarter+", { fraction: 0.5, waxing: true }],
    ["gibbous+", { fraction: 0.75, waxing: true }],
    ["full", { fraction: 1.0, waxing: true }],
    ["gibbous-", { fraction: 0.75, waxing: false }],
    ["quarter-", { fraction: 0.5, waxing: false }],
    ["cresc-", { fraction: 0.22, waxing: false }]
  ];
  const cell = 60, cols = phases.length;
  const out = document.getElementById("out");
  out.width = cols * cell; out.height = cell + 16;
  const octx = out.getContext("2d"); octx.imageSmoothingEnabled = false;
  const buf = document.createElement("canvas"); buf.width = L; buf.height = L;
  const b = buf.getContext("2d"); b.imageSmoothingEnabled = false;
  const P = createPainter(b, L);
  const sky = { top: "#0a1230", hor: "#243056" };
  phases.forEach(([label, illum], i) => {
    b.fillStyle = sky.top; b.fillRect(0, 0, L, L);
    // a few stars for context
    for (let s = 0; s < 8; s++) b.fillStyle = "#dfe6ff", b.fillRect((s * 13) % L, (s * 7) % 20, 1, 1);
    drawMoon(P, { x: 25, y: 22 }, illum, sky);
    octx.drawImage(buf, 0, 0, L, L, i * cell, 0, cell, cell);
    octx.fillStyle = "#bbb"; octx.font = "9px monospace"; octx.fillText(label, i * cell + 3, cell + 11);
  });
  return { w: out.width, h: out.height };
};

const L = 50, GEOM = { L, horizon: 24, groundTop: 37, roadBot: 46 };
function densFrom(place, res) {
  const pop = place.population;
  let pd = null;
  if (pop && pop > 0) { pd = (Math.log(pop) / Math.LN10 - 3.6) / 4.2; pd = pd < 0 ? 0 : pd > 1 ? 1 : pd; }
  if (place.density != null) return place.density;
  return Math.max(pd != null ? pd : 0.22, res.biome.id === "city" ? 0.5 : 0);
}

function mockEnv(over) {
  return Object.assign({
    night: false, dayT: 1, frame: 0, col: c => c, rng: () => 0.5, wind: 0.45, dir: 1,
    text: "72°", code: 0, cloud: 20, aqi: 40, temp: 72, rough: false, cold: false, waveM: 0.9, tide: 0.5,
    L, horizon: 24, groundTop: 37, roadBot: 46, sunrise: 380, sunset: 1180, latitude: 34, intensity: 0
  }, over || {});
}

// Render a labelled contact sheet of a catalog list (day row + night row per entry).
window.contactSheet = function (list, title) {
  const cell = 54, cols = 6, cw = cell, ch = cell + 12;
  const rows = Math.ceil(list.length / cols);
  const out = document.getElementById("out");
  out.width = cols * cw; out.height = rows * ch + 20;
  const octx = out.getContext("2d"); octx.imageSmoothingEnabled = false;
  octx.fillStyle = "#141018"; octx.fillRect(0, 0, out.width, out.height);
  octx.fillStyle = "#8fd"; octx.font = "12px monospace"; octx.fillText(title, 6, 14);

  const buf = document.createElement("canvas"); buf.width = L; buf.height = L;
  const b = buf.getContext("2d"); b.imageSmoothingEnabled = false;
  const P = createPainter(b, L);

  list.forEach((e, i) => {
    const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch + 20;
    const anchor = e.anchor || "baseline";
    [false, true].forEach((night, ni) => {
      b.clearRect(0, 0, L, L);
      // background tint so night sprites are visible
      b.fillStyle = night ? "#1a2036" : "#9ac4d8"; b.fillRect(0, 0, L, L);
      const env = mockEnv({ night, dayT: night ? 0.1 : 1, col: night ? (c => P.mix(c, "#20202c", 0.55)) : (c => c) });
      const x = anchor === "center" ? 25 : Math.round((L - (e.w || 8)) / 2);
      const yb = anchor === "center" ? 25 : 40;
      try { e.draw(P, x, yb, env); } catch (err) { b.fillStyle = "#f44"; b.fillRect(0, 0, L, L); console.error("DRAW FAIL", e.id, err.message); window.__errors = (window.__errors||[]); window.__errors.push(e.id + ": " + err.message); }
      octx.drawImage(buf, cx + ni * (cw / 2) + 1, cy, cw / 2 - 2, cw / 2 - 2);
    });
    octx.fillStyle = "#bbb"; octx.font = "8px monospace";
    octx.fillText((e.id || "?").slice(0, 10), cx + 2, cy + cw / 2 + 9);
  });
  return { w: out.width, h: out.height };
};

// Render a full scene (a strip of frames) for a place, at a given time & weather.
window.sceneStrip = function (placeOpts, weatherOver, nowMin, frames) {
  const place = Object.assign({ name: "", country: "", admin1: "", latitude: 34, longitude: -118, timezone: "UTC", elevation: 20 }, placeOpts);
  const res = resolveScene(place, placeOpts.opts || {});
  const W = Object.assign(defaultState(), weatherOver || {});
  const lt = { year: 2026, month: 7, day: 18 };
  const world = {
    geometry: GEOM, biome: res.biome, landscape: res.landscape, landmark: res.landmark,
    latitude: res.latitude, coastal: res.coastal, unit: res.unit, density: densFrom(place, res), cannabis: res.cannabis,
    pools: pools(res.biome.id), W, sunrise: W.sunrise, sunset: W.sunset,
    moon: moonIllumination(lt.year, lt.month, lt.day), seed: seedFrom(place.name + place.latitude),
    place, tempText: () => (W.temp == null ? "--" : W.temp + "°")
  };
  const buf = document.createElement("canvas"); buf.width = L; buf.height = L;
  const b = buf.getContext("2d"); b.imageSmoothingEnabled = false;
  const P = createPainter(b, L);
  const scene = createScene(P, world, { reduce: false });
  const dT = dayFactor(nowMin, W.sunrise, W.sunset);
  const n = frames || 1, scale = 3, gap = 4;
  const out = document.getElementById("out");
  out.width = n * (L * scale + gap); out.height = L * scale + 16;
  const octx = out.getContext("2d"); octx.imageSmoothingEnabled = false;
  octx.fillStyle = "#141018"; octx.fillRect(0, 0, out.width, out.height);
  for (let f = 0; f < n; f++) {
    try { scene.render(f * 8 + 1, nowMin, dT); } catch (err) { console.error("SCENE FAIL", err.message); window.__errors = (window.__errors||[]); window.__errors.push("scene: " + err.message); }
    octx.drawImage(buf, 0, 0, L, L, f * (L * scale + gap), 12, L * scale, L * scale);
  }
  octx.fillStyle = "#8fd"; octx.font = "11px monospace";
  octx.fillText(res.landscape.name + " / " + res.biome.id + (res.landmark ? " [" + res.landmark.id + "]" : ""), 4, 10);
  return { w: out.width, h: out.height, biome: res.biome.id, landscape: res.landscape.id, landmark: res.landmark && res.landmark.id };
};
// ---- 12-city preview grid (for the README) ----
function buildScene(spec) {
  const place = Object.assign({ name: "", country: "United States", admin1: "", latitude: 34, longitude: -118, timezone: "UTC", elevation: 20 }, spec.place);
  const res = resolveScene(place, {});
  const W = Object.assign(defaultState(), spec.wx || {});
  const world = {
    geometry: GEOM, biome: res.biome, landscape: res.landscape, landmark: res.landmark,
    latitude: res.latitude, coastal: res.coastal, unit: res.unit, density: densFrom(place, res), cannabis: res.cannabis,
    pools: pools(res.biome.id), W, sunrise: W.sunrise, sunset: W.sunset,
    moon: moonIllumination(2026, 7, 18), seed: seedFrom(place.name + place.latitude),
    place, tempText: () => (W.temp == null ? "--" : W.temp + "°")
  };
  const buf = document.createElement("canvas"); buf.width = L; buf.height = L;
  const b = buf.getContext("2d"); b.imageSmoothingEnabled = false;
  const P = createPainter(b, L);
  return { scene: createScene(P, world, { reduce: false }), buf, now: spec.now, label: spec.label,
    unit: res.unit, dayT: dayFactor(spec.now, W.sunrise, W.sunset), res, density: world.density };
}

// Evaluation grid: render many cities (with population → density) into one sheet.
window.cityGrid = function (specs, cols) {
  cols = cols || 6;
  const built = specs.map(s => ({ s, b: buildScene(s) }));
  const tile = 100, pad = 5, lab = 28, rows = Math.ceil(built.length / cols);
  const out = document.getElementById("out");
  out.width = cols * (tile + pad) + pad; out.height = rows * (tile + lab + pad) + pad;
  const octx = out.getContext("2d"); octx.imageSmoothingEnabled = false;
  octx.fillStyle = "#141018"; octx.fillRect(0, 0, out.width, out.height);
  built.forEach(({ s, b }, i) => {
    for (let f = 0; f <= 26; f++) b.scene.render(f, b.now, b.dayT);
    const cx = pad + (i % cols) * (tile + pad), cy = pad + Math.floor(i / cols) * (tile + lab + pad);
    octx.drawImage(b.buf, 0, 0, L, L, cx, cy, tile, tile);
    octx.fillStyle = "#0b0d13"; octx.fillRect(cx, cy + tile, tile, lab);
    octx.textBaseline = "middle";
    octx.fillStyle = "#cfd6e2"; octx.font = "10px monospace"; octx.fillText(s.label, cx + 4, cy + tile + 9);
    octx.fillStyle = "#8a94a4"; octx.font = "9px monospace";
    octx.fillText(b.res.biome.id + (b.res.landmark ? "·" + b.res.landmark.id : "") + " d" + b.density.toFixed(2), cx + 4, cy + tile + 20);
  });
  return { w: out.width, h: out.height };
};

let PREVIEW = null;
window.previewInit = function (specs) {
  PREVIEW = specs.map(buildScene);
  const cols = 4, rows = 3, tile = 100, pad = 4, lab = 16;
  const out = document.getElementById("out");
  out.width = cols * (tile + pad) + pad;
  out.height = rows * (tile + lab + pad) + pad;
  return { w: out.width, h: out.height, tiles: PREVIEW.length };
};
window.previewFrame = function (f) {
  const cols = 4, tile = 100, pad = 4, lab = 16;
  const out = document.getElementById("out");
  const octx = out.getContext("2d"); octx.imageSmoothingEnabled = false;
  octx.fillStyle = "#0e1016"; octx.fillRect(0, 0, out.width, out.height);
  PREVIEW.forEach((t, i) => {
    try { t.scene.render(f, t.now, t.dayT); } catch (e) { window.__errors = (window.__errors||[]); window.__errors.push("preview " + t.label + ": " + e.message); }
    const cx = pad + (i % cols) * (tile + pad), cy = pad + Math.floor(i / cols) * (tile + lab + pad);
    octx.drawImage(t.buf, 0, 0, L, L, cx, cy, tile, tile);
    octx.fillStyle = "#0b0d13"; octx.fillRect(cx, cy + tile, tile, lab);
    octx.fillStyle = "#cfd6e2"; octx.font = "10px monospace"; octx.textBaseline = "middle";
    octx.fillText(t.label, cx + 4, cy + tile + lab / 2);
  });
  return { f };
};

// ---- branding assets (icon / logo / social preview) ----
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const HERO = {
  coast: { place: { name: "Malibu", country: "United States", latitude: 34.02, longitude: -118.49 }, wx: { temp: 72, code: 0, waveM: 1.1 }, now: 1150 },
  city: { place: { name: "New York", country: "United States", latitude: 40.71, longitude: -74.01 }, wx: { temp: 61, code: 2 }, now: 70 },
  desert: { place: { name: "Las Vegas", country: "United States", latitude: 36.17, longitude: -115.14, elevation: 610 }, wx: { temp: 104, code: 0 }, now: 1180 },
  mountain: { place: { name: "Zurich", country: "Switzerland", latitude: 47.37, longitude: 8.54, elevation: 408 }, wx: { temp: 24, code: 73, cloud: 90 }, now: 620 }
};
function renderHero(octx, spec, dx, dy, dw, dh, frame, radius, dim) {
  const s = buildScene(spec);
  for (let f = 0; f <= frame; f++) s.scene.render(f, s.now, s.dayT);   // warm a little life in
  octx.save();
  if (radius) { roundRect(octx, dx, dy, dw, dh, radius); octx.clip(); }
  octx.imageSmoothingEnabled = false;
  octx.drawImage(s.buf, 0, 0, L, L, dx, dy, dw, dh);
  if (dim) { octx.fillStyle = "rgba(14,16,22," + dim + ")"; octx.fillRect(dx, dy, dw, dh); }
  octx.restore();
}
window.brand = function (kind) {
  const out = document.getElementById("out");
  const octx = out.getContext("2d");
  if (kind === "icon") {
    const S = 512; out.width = S; out.height = S;
    octx.imageSmoothingEnabled = false;
    renderHero(octx, HERO.coast, 0, 0, S, S, 16, 64, 0);
    octx.strokeStyle = "rgba(255,255,255,0.10)"; octx.lineWidth = 8; roundRect(octx, 4, 4, S - 8, S - 8, 60); octx.stroke();
    return { w: S, h: S };
  }
  if (kind === "logo") {
    const W = 1024, H = 256; out.width = W; out.height = H;
    octx.fillStyle = "#0e1016"; roundRect(octx, 0, 0, W, H, 40); octx.fill();
    renderHero(octx, HERO.coast, 24, 28, 200, 200, 16, 28, 0);
    octx.textBaseline = "middle";
    octx.fillStyle = "#eef2f6"; octx.font = "bold 76px ui-monospace, Menlo, monospace";
    octx.fillText("weather-vivarium", 250, 108);
    octx.fillStyle = "#9aa2b1"; octx.font = "30px ui-monospace, Menlo, monospace";
    octx.fillText("a living weather diorama for any city", 252, 168);
    return { w: W, h: H };
  }
  if (kind === "social") {
    const W = 1280, H = 640; out.width = W; out.height = H;
    octx.fillStyle = "#0e1016"; octx.fillRect(0, 0, W, H);
    // filmstrip of four biomes across the top, dimmed
    const panels = ["coast", "city", "desert", "mountain"], pw = W / 4;
    panels.forEach((k, i) => renderHero(octx, HERO[k], i * pw, 0, pw, H, 16, 0, 0.18));
    // gradient scrim toward the centre for legibility
    const g = octx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(14,16,22,0.35)"); g.addColorStop(0.5, "rgba(14,16,22,0.72)"); g.addColorStop(1, "rgba(14,16,22,0.88)");
    octx.fillStyle = g; octx.fillRect(0, 0, W, H);
    octx.textAlign = "center"; octx.textBaseline = "middle";
    octx.fillStyle = "#f2f6fa"; octx.font = "bold 108px ui-monospace, Menlo, monospace";
    octx.fillText("weather-vivarium", W / 2, H / 2 - 40);
    octx.fillStyle = "#cdd6e2"; octx.font = "40px ui-monospace, Menlo, monospace";
    octx.fillText("a living pixel-art weather diorama for any city", W / 2, H / 2 + 34);
    octx.fillStyle = "#7fd0ff"; octx.font = "30px ui-monospace, Menlo, monospace";
    octx.fillText("1000 cities  ·  real weather + sun + moon  ·  dependency-free", W / 2, H / 2 + 96);
    octx.textAlign = "left";
    return { w: W, h: H };
  }
};

window.CATALOG = CATALOG;
window.LANDMARKS = LANDMARKS;
window.__ready = true;
</script>
</body></html>
