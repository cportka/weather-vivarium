name: "🗺️ Problem with a city"
description: A city renders wrong — wrong biome, wrong landmark, wrong temperature unit, out of place.
title: "[city-problem] "
labels: ["feedback", "city-problem"]
body:
  - type: input
    id: city
    attributes:
      label: Which city?
      description: The exact city (and country/region) you searched or saw.
      placeholder: "e.g. Reno, Nevada, USA"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong?
      description: What did you expect, and what did you see instead?
      placeholder: "e.g. shows as alpine/mountain, but Reno is high desert; matched the wrong landscape."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      multiple: true
      options:
        - Wrong biome / landscape
        - Wrong or missing landmark
        - Wrong temperature unit (°F vs °C)
        - Wrong time of day / sun / moon
        - Something drawn in the wrong place (z-order / floating / facing)
        - Other
  - type: input
    id: link
    attributes:
      label: Screenshot or link (optional)
