name: CI

# Runs the test suite on every push and PR: SemVer version-sync (package.json /
# CHANGELOG / README / src), a syntax check of every module, and the node --test
# suite (catalog breadth, the resolver, and a browserless render of every sprite).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run test suite
        run: bash tests/run-tests.sh
