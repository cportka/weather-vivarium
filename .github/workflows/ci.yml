name: CI

# Runs the test suite on every push and PR: SemVer version-sync (package.json /
# CHANGELOG / README / src), a syntax check of every module, and the node --test
# suite (catalog breadth, the resolver, the 50 reference cities, and a browserless
# render of every sprite). A second job renders the 50-city reference sheets in a
# real browser and uploads them, so every change has a picture attached.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run test suite
        run: bash tests/run-tests.sh

  reference:
    name: reference cities + page controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render the reference sheets + the catalog/scene sweep
        run: |
          npm run verify:reference
          npm run verify:render
      - name: Check verify.html's controls actually do something
        run: npm run verify:controls
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-cities
          path: verify/out/*.png
          if-no-files-found: error
