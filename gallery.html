<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>weather-vivarium — 12 cities, right now</title>
<meta name="description" content="Twelve live weather-vivarium dioramas — Berkeley, New York, Honolulu, Anchorage, Seattle, Las Vegas, Miami, Austin, Washington, New Orleans, Memphis and Chicago — driven by each city's current weather." />
<meta name="color-scheme" content="dark" />
<style>
  body { margin:0; background:radial-gradient(1200px 700px at 50% -10%, #1a2030, #0e1016); color:#e6e9ef;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height:100vh; }
  header { text-align:center; padding:26px 16px 4px; }
  h1 { margin:0; font-size:20px; }
  header p { margin:6px 0 0; color:#9aa2b1; font-size:13px; }
  .grid { max-width:900px; margin:18px auto; padding:0 16px 30px;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  @media (max-width:760px){ .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:440px){ .grid { grid-template-columns:1fr; } }
  .tile { background:#171a22; border:1px solid #252a35; border-radius:12px; padding:10px;
    display:flex; flex-direction:column; align-items:center; gap:6px; }
  .tile .mount { width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
  .tile .name { font-size:12.5px; font-weight:600; }
  .tile .meta { font-size:11px; color:#9aa2b1; text-align:center; min-height:2.4em; line-height:1.3; }
  a { color:#4a9eff; text-decoration:none; }
  footer { text-align:center; color:#9aa2b1; font-size:12px; padding:10px 16px 30px; }
</style>
</head>
<body>
<header>
  <h1>weather-vivarium — twelve cities, right now</h1>
  <p>each diorama runs on its city's <b>current</b> weather · <a href="index.html">try any city →</a></p>
</header>
<div class="grid" id="grid"></div>
<footer>data from <a href="https://open-meteo.com">Open-Meteo</a> · <a href="https://github.com/cportka/weather-vivarium">source</a></footer>

<script type="module">
  import { createVivarium } from "./src/index.js";

  // Explicit coords so each place is unambiguous; weather is still fetched live.
  const CITIES = [
    ["Berkeley, CA", 37.87, -122.27, "America/Los_Angeles", 52],
    ["New York, NY", 40.71, -74.01, "America/New_York", 10],
    ["Honolulu, HI", 21.31, -157.86, "Pacific/Honolulu", 6],
    ["Anchorage, AK", 61.22, -149.90, "America/Anchorage", 30],
    ["Seattle, WA", 47.61, -122.33, "America/Los_Angeles", 56],
    ["Las Vegas, NV", 36.17, -115.14, "America/Los_Angeles", 610],
    ["Miami, FL", 25.76, -80.19, "America/New_York", 2],
    ["Austin, TX", 30.27, -97.74, "America/Chicago", 149],
    ["Washington, DC", 38.90, -77.04, "America/New_York", 7],
    ["New Orleans, LA", 29.95, -90.07, "America/Chicago", 1],
    ["Memphis, TN", 35.15, -90.05, "America/Chicago", 78],
    ["Chicago, IL", 41.88, -87.63, "America/Chicago", 181]
  ];

  const grid = document.getElementById("grid");
  for (const [label, lat, lon, tz, elev] of CITIES) {
    const tile = document.createElement("div"); tile.className = "tile";
    const m = document.createElement("div"); m.className = "mount";
    const name = document.createElement("div"); name.className = "name"; name.textContent = label;
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = "…";
    tile.append(m, name, meta); grid.appendChild(tile);

    const city = label.split(",")[0];
    const inst = createVivarium(m, { city, lat, lon, timezone: tz, elevation: elev, country: "United States", size: 180, interactive: true });
    const paint = () => {
      const r = inst.resolution, w = inst.weather;
      if (!r) return;
      const u = r.unit === "celsius" ? "C" : "F";
      meta.innerHTML = (w.temp == null ? "…" : w.temp + "°" + u) + " · " + r.landscape.name +
        (r.landmark ? " · " + r.landmark.name : "");
    };
    paint();
    const t = setInterval(paint, 1500); setTimeout(() => clearInterval(t), 14000);
  }
</script>
</body>
</html>
